<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 1 — Aya El Hadouti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --pink:#dc267f; --dark:#2b2d42; --font:'Poppins',sans-serif; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--font); background:#f9f6f9; color:#454360; display:flex; flex-direction:column; min-height:100vh; }
    header { background:var(--dark); padding:1.1rem 2rem; display:flex; align-items:center; }
    header a { display:flex; align-items:center; gap:.6rem; color:rgba(255,255,255,.75); text-decoration:none; font-size:.95rem; font-weight:500; transition:color .2s; }
    header a:hover { color:var(--pink); }
    header a i { font-size:1.1rem; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .card { background:#fff; border-radius:1.5rem; border:1.5px solid #e8d5e8; padding:3.5rem 3rem; text-align:center; max-width:480px; width:100%; box-shadow:0 8px 32px rgba(220,38,127,.07); }
    .icon { width:72px; height:72px; border-radius:1rem; background:#fce8f3; display:flex; align-items:center; justify-content:center; font-size:2rem; color:var(--pink); margin:0 auto 1.5rem; }
    .label { font-size:.75rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--pink); margin-bottom:.5rem; }
    h1 { font-size:1.8rem; font-weight:700; color:var(--dark); margin-bottom:1rem; }
    .pill { display:inline-block; background:var(--pink); color:#fff; font-size:.8rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:.35rem 1rem; border-radius:20px; margin-bottom:1.5rem; }
    p { font-size:.95rem; color:#888; line-height:1.7; }
    footer { background:var(--dark); color:rgba(255,255,255,.4); text-align:center; font-size:.75rem; padding:1.2rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><i class="bi bi-arrow-left"></i> Back to Portfolio</a>
  </header>
  <main>
    <div class="card">
      <div class="icon"><i class="bi bi-hourglass-split"></i></div>
      <div class="label">Design 01: Service Website</div>
      <h1>Coming Soon</h1>
      <span class="pill">À venir</span>
      <p>This project is currently in progress. Check back soon for the full case study.</p>
    </div>
  </main>
  <footer>© 2026 Aya El Hadouti</footer>
</body>
</html>
